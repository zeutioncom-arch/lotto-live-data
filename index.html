<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>생활문제 해결소 · 로또 당첨금 데이터</title><style>body{font-family:system-ui,sans-serif;max-width:740px;margin:3rem auto;padding:0 1.2rem;line-height:1.7;color:#223}a{color:#0969da}pre{background:#f5f7fa;border-radius:8px;white-space:pre-wrap;padding:1rem;overflow-wrap:anywhere}</style><h1>로또6/45 당첨금 데이터</h1><p>생활문제 해결소 자동 수집 데이터 공개 페이지입니다. 정상 검증된 회차만 계산기에 반영됩니다.</p><p><a href="./data/latest.json">최신 당첨 데이터(JSON) 보기</a></p><pre id="out">데이터를 확인하고 있습니다.</pre><script>fetch('./data/latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('out').textContent=JSON.stringify({status:d.status,draw_no:d.draw_no,draw_date:d.draw_date,verified_at_kst:d.verified_at_kst},null,2)}).catch(e=>document.getElementById('out').textContent='조회 오류: '+e.message)</script></html>
